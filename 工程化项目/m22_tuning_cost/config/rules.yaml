# ---- 工单 M2-2 验收标准四档门槛（数字外置：改配置不改代码）----
# 数值逐字取自《M2-2工单-XGBoost参数调优.md》"四、验收标准"表（军规 2 小时限时）；
# B/A 档口径参数（曲线最少档数、拐点增益阈值、快速方案容差）是"实测判据"。
tiers:
  D:
    style_min: 70.0        # 及格(D)：基线可复现；代码规范率≥70%
  C:
    f1_min: 0.72           # 良好(C)：F1≥0.72限时内
    limit_sec: 7200        # 工单军规：2 小时限时（墙钟实测对比）
  B:
    curve_points_min: 4    # 优秀(B)：曲线完整（≥4 档实测 F1）拐点论证；决策记录完整
    knee_gain_max: 0.01    # 拐点口径：相邻增益跌破该阈值即拐点（随报告登记）
  A:
    f1_min: 0.88           # 优(A)：F1≥0.88或快速方案论证（口头论证归人工答辩）
    fast_gap_max: 0.02     # 快速方案机器判据：预算搜索与穷举 F1 差≤0.02 且兜底臂过C线
