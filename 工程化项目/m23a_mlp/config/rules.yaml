warn: 80.0
danger: 95.0
unit: "c"
seed: 7
topk: 3
# ---- 工单 M2-3a 验收标准四档门槛（数字外置：改配置不改代码）----
# 数值逐字取自《M2-3a工单-MLP神经网络.md》"四、验收标准"表；
# B/A 档口径参数（Dropout 扫描臂、结构搜索最少候选数、PNG 实测字节下限）
# 是"实测判据"，不是工单门槛本身。
tiers:
  D:
    style_min: 70.0          # 及格(D)：模板可运行出指标；代码规范率≥70%
  C:
    acc_min: 0.75            # 良好(C)：准确率≥75%图完整（PNG 实测存在且字节达标）
    png_min_bytes: 1000      # "图完整"实测口径：learning_curve.png 字节数（工单未给下限→兜底口径，非工单数字）
  B:
    dropout_arms: [0.1, 0.2, 0.3]  # 优秀(B)：Dropout 扫描臂——gap收窄且指标不降；决策记录完整
  A:
    candidates_min: 2        # 优(A)：找到性价比最优结构（≥2 组结构实测参数量/耗时/acc）
